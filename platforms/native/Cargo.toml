[package]
name = "snap-native"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
snap-protocol.workspace = true
snap-runtime.workspace = true
snap-client.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
form_urlencoded = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }

[lints]
workspace = true

[package.metadata.snap]
role = "platform"
