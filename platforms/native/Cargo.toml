[package]
name = "snap-native"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
snap-protocol.workspace = true
snap-identity.workspace = true
snap-store.workspace = true
snap-web.workspace = true
snap-runtime.workspace = true
snap-client.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["ws"] }
form_urlencoded = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4", "v7"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
rusqlite = { version = "0.38", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
futures-channel = "0.3"

[lints]
workspace = true

[[test]]
name = "store-contract"
path = "../../tests/store/contract.rs"

[package.metadata.snap]
role = "platform"

[package.metadata.cargo-machete]
# The shared carrier contract is outside this package's source directory.
ignored = ["futures-channel"]
