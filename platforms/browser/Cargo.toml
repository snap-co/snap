[package]
name = "snap-browser"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
snap-web.workspace = true
snap-client.workspace = true
snap-protocol.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Request", "RequestInit", "RequestCredentials", "Response", "Headers", "AbortController", "AbortSignal", "Url", "UrlSearchParams", "WebSocket", "MessageEvent", "CloseEvent", "Event", "Window", "Location"] }
gloo-timers = { version = "0.3", features = ["futures"] }
futures-util = "0.3"
futures-channel = "0.3"

[lints]
workspace = true

[package.metadata.snap]
role = "platform"
