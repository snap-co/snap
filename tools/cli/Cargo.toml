[package]
name = "snap-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "snap"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
toml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "io-util", "time", "sync", "net"] }
nix = { version = "0.30", features = ["signal", "user", "fs", "net"] }
notify = "8"
url = "2"
snap-store.workspace = true
snap-store-sqlite = { path = "../../crates/platform/store-sqlite" }
snap-config.workspace = true
snap-platform-tests = { path = "../../tests/platform" }
tempfile = "3"

[lints]
workspace = true

[package.metadata.snap]
role = "tool"
