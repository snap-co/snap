[workspace]
members = [
    "crates/execution",
    "crates/transport",
    "platforms/local",
    "platforms/sqlite",
    "apps/testy",
    "apps/testy/local",
    "apps/testy/wasm",
    "apps/testy/properties",
    "crates/store",
    "crates/identity",
    "platforms/crypto",
    "tests/properties",
    "tools/cli",
]
# App rewrites and their HTTP/LLM code are outside the transport/Store spike.
exclude = ["apps/authy", "apps/chatty", "crates/http", "crates/llm"]
resolver = "3"
default-members = [
    "crates/identity",
    "platforms/crypto",
    "crates/store",
    "platforms/sqlite",
    "crates/execution",
    "crates/transport",
    "platforms/local",
    "apps/testy",
    "apps/testy/local",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
snap-store = { path = "crates/store" }
wasm-bindgen = "=0.2.128"
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
