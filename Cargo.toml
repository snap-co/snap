[workspace]
members = [
    "kits/react/wasm",
    "crates/platform/config",
    "apps/factorio",
    "apps/factorio/server",
    "apps/factorio/web/wasm",
    "apps/factorio/properties",
    "crates/transport",
    "crates/platform/transport-native",
    "crates/platform/transport-tcp",
    "crates/platform/transport-ws",
    "crates/platform/wasm-browser",
    "apps/factorio/cli",
    "crates/platform/identity-native",
    "crates/http",
    "crates/platform/store-sqlite",
    "apps/testy",
    "apps/testy/server",
    "apps/testy/native",
    "apps/testy/web/wasm",
    "apps/testy/properties",
    "crates/store",
    "crates/host",
    "crates/access",
    "crates/document",
    "crates/oidc",
    "apps/authy",
    "apps/authy/server",
    "apps/authy/web/wasm",
    "apps/chatty",
    "apps/chatty/server",
    "apps/chatty/web/wasm",
    "crates/identity",
    "crates/platform/crypto",
    "tests/properties",
    "tests/platform",
    "tests/browser",
    "apps/testing/browser",
    "tools/cli",
]
resolver = "3"
default-members = [
    "crates/platform/config",
    "apps/factorio",
    "apps/factorio/server",
    "apps/factorio/web/wasm",
    "crates/http",
    "crates/platform/identity-native",
    "apps/chatty",
    "apps/chatty/server",
    "apps/chatty/web/wasm",
    "crates/oidc",
    "crates/platform/transport-native",
    "crates/platform/transport-tcp",
    "crates/platform/transport-ws",
    "apps/factorio/cli",
    "apps/authy",
    "apps/authy/server",
    "apps/authy/web/wasm",
    "crates/document",
    "crates/access",
    "crates/identity",
    "crates/platform/crypto",
    "crates/store",
    "crates/host",
    "crates/platform/store-sqlite",
    "crates/transport",
    "apps/testy",
    "apps/testy/server",
    "apps/testy/native",
    "tests/platform",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
snap-config = { path = "crates/platform/config" }
snap-http = { path = "crates/http" }
chatty = { path = "apps/chatty" }
snap-access = { path = "crates/access" }
snap-document = { path = "crates/document" }
snap-identity = { path = "crates/identity" }
snap-oidc = { path = "crates/oidc" }
authy = { path = "apps/authy" }
snap-store = { path = "crates/store" }
snap-host = { path = "crates/host" }
wasm-bindgen = "=0.2.128"
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
