[package]
name = "chatty-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "chatty"
path = "src/main.rs"
doc = false

[dependencies]
snap-http.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
snap-config.workspace = true
serde.workspace = true
chatty.workspace = true
snap-document.workspace = true
snap-transport-native = { path = "../../../crates/platform/transport-native" }
snap-transport-ws = { path = "../../../crates/platform/transport-ws" }
snap-identity-native = { path = "../../../crates/platform/identity-native", features = ["oauth"] }
snap-store-sqlite = { path = "../../../crates/platform/store-sqlite" }
snap-access.workspace = true
snap-identity.workspace = true
snap-store.workspace = true
snap-host.workspace = true
snap-transport = { path = "../../../crates/transport" }
serde_json.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "net", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }
toml = "0.9"

[lints]
workspace = true

[package.metadata.snap]
role = "host"
