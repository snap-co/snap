[package]
name = "chatty-native"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "chatty"
path = "src/main.rs"
doc = false

[dependencies]
chatty.workspace = true
snap-document.workspace = true
snap-document-local = { path = "../../../platforms/document" }
snap-oauth-local = { path = "../../../platforms/oauth" }
snap-sqlite = { path = "../../../platforms/sqlite" }
snap-access.workspace = true
snap-oidc.workspace = true
snap-store.workspace = true
snap-transport = { path = "../../../crates/transport" }
serde_json.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "net", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }
toml = "0.9"

[lints]
workspace = true

[package.metadata.snap]
role = "composition"
