version = 1
application = "chatty"

[server]
manifest = "native/Cargo.toml"
bin = "chatty"

[dev]
address = "127.0.0.1:3850"
backend-address = "127.0.0.1:3851"

[check]
architecture = true
rust = ["Cargo.toml", "native/Cargo.toml", "workers/Cargo.toml"]
commands = [
  ["cargo", "build", "-p", "chatty-native", "-p", "authy-native"],
  ["../../bin/snap", "build", "../authy"],
  ["bun", "../../scripts/build-chatty.ts"],
  ["bun", "../../scripts/check-client.ts"],
  ["bun", "test", "../../tests/protocol/chatty.test.ts", "../../tests/protocol/chatty-session.test.ts"],
  ["bunx", "playwright", "test", "--config", "../../playwright.config.ts", "chatty.spec.ts"]
]
