version = 1
application = "chatty"

[build.clients.web]
kind = "web"
source = "web"
wasm = "web/wasm/Cargo.toml"
sdk = "web/client.ts"

[build.servers.native]
manifest = "server/Cargo.toml"
targets = ["host"]

[build.clients.agent]
kind = "native"
manifest = "cli/Cargo.toml"
binary = "chatty-agent"
targets = ["host"]

[check]
rust = ["Cargo.toml", "server/Cargo.toml", "web/wasm/Cargo.toml", "cli/Cargo.toml"]
typescript = ["web/tsconfig.json"]

[test.memory]
commands = [["cargo", "test", "-p", "chatty"]]

[test.browser]
commands = [["../../bin/browser-tests", "chatty"]]

[test.native]
commands = [["cargo", "build", "-p", "authy-server", "-p", "chatty-server"], ["cargo", "test", "-p", "chatty-cli", "--test", "agents", "--", "--ignored"], ["cargo", "test", "-p", "snap-crypto", "--", "--ignored"]]
