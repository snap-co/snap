version = 1
application = "chatty"

[build]

[check]
rust = ["Cargo.toml", "native/Cargo.toml"]

[test.memory]
commands = [["cargo", "test", "-p", "chatty"]]

[test.browser]
commands = [["../../bin/check-chatty-web"]]

[test.native]
commands = [["cargo", "test", "-p", "chatty-native", "--", "--ignored"], ["cargo", "test", "-p", "snap-oauth-local", "--test", "crypto", "--", "--ignored"]]
