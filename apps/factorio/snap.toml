version = 1
application = "factorio"

[check]
rust = ["Cargo.toml", "native/Cargo.toml", "wasm/Cargo.toml", "cli/Cargo.toml"]

[build]
cli = "factory"

[test.memory]
commands = [["cargo", "test", "-p", "factorio"]]

[test.native]
commands = [["cargo", "build", "-p", "factory-cli"], ["cargo", "test", "-p", "snap-transport-native", "--test", "tls", "--", "--ignored"], ["cargo", "test", "-p", "factorio-native", "--", "--include-ignored"], ["bun", "test", "tests/client.test.ts"]]

[test.browser]
commands = [["bun", "../../scripts/test-factorio.ts"]]
