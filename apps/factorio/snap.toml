version = 1
application = "factorio"

[check]
rust = ["Cargo.toml", "native/Cargo.toml", "wasm/Cargo.toml", "cli/Cargo.toml"]

[build]
cli = "factorio"
server_args = ["serve"]

[test.memory]
commands = [["cargo", "test", "-p", "factorio"]]

[test.native]
commands = [["cargo", "build", "-p", "factorio-native"], ["cargo", "test", "-p", "snap-transport-native", "--test", "tls", "--", "--ignored"], ["cargo", "test", "-p", "factorio-native", "--", "--include-ignored"]]

[test.browser]
commands = [["bun", "../../scripts/test-factorio.ts"]]
