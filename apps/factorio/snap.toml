version = 1
application = "factorio"

[check]
rust = ["Cargo.toml", "native/Cargo.toml", "wasm/Cargo.toml"]

[build]

[test.memory]
commands = [["cargo", "test", "-p", "factorio"]]

[test.native]
commands = [["cargo", "test", "-p", "factorio-native", "--", "--include-ignored"], ["bun", "test", "tests/intake-tool.test.ts", "tests/client.test.ts"]]

[test.browser]
commands = [["bun", "../../scripts/test-factorio.ts"]]
