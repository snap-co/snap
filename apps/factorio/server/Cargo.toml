[package]
name = "factorio-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "factorio"
path = "src/main.rs"
doc = false

[dependencies]
factorio-cli = { path = "../cli" }
snap-config.workspace = true
factorio = { path = ".." }
snap-document.workspace = true
snap-transport-native = { path = "../../../crates/platform/transport-native" }
snap-transport-ws = { path = "../../../crates/platform/transport-ws" }
snap-identity-native = { path = "../../../crates/platform/identity-native", features = ["oauth"] }
snap-store-sqlite = { path = "../../../crates/platform/store-sqlite" }
snap-access.workspace = true
snap-identity.workspace = true
snap-store.workspace = true
snap-transport = { path = "../../../crates/transport" }
snap-transport-tcp = { path = "../../../crates/platform/transport-tcp" }
serde_json.workspace = true
serde.workspace = true
axum = "0.8"
async-stream = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "net", "sync", "process", "io-util"] }
tower-http = { version = "0.6", features = ["fs"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }
nix = { version = "0.30", features = ["signal", "process"] }

[dev-dependencies]
age = { version = "0.11", default-features = false }
tempfile = "3"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[lints]
workspace = true

[package.metadata.snap]
role = "host"
