[package]
name = "factory-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "factory"
path = "src/main.rs"

[dependencies]
factorio = { path = ".." }
snap-document.workspace = true
snap-transport = { path = "../../../crates/transport" }
snap-transport-native = { path = "../../../platforms/transport" }
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "process"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[package.metadata.snap]
role = "composition"
