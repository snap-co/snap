id = "0001_signup"

[[changes]]
action = "create_table"
[changes.table]
name = "signup.accounts"
columns = [{ name = "id", kind = "integer" }, { name = "email", kind = "text" }]
primary = ["id"]
indexes = [{ name = "email", columns = ["email"], unique = true }]

[[changes]]
action = "create_table"
[changes.table]
name = "signup.grants"
columns = [{ name = "account", kind = "integer" }, { name = "role", kind = "text" }]
primary = ["account"]
foreign = [{ columns = ["account"], table = "signup.accounts", references = ["id"] }]

[[changes]]
action = "create_table"
[changes.table]
name = "signup.documents"
columns = [{ name = "owner", kind = "integer" }, { name = "title", kind = "text" }]
primary = ["owner"]
foreign = [{ columns = ["owner"], table = "signup.accounts", references = ["id"] }]

[[changes]]
action = "create_table"
[changes.table]
name = "signup.outbox"
columns = [{ name = "id", kind = "integer" }, { name = "kind", kind = "text" }]
primary = ["id"]
foreign = [{ columns = ["id"], table = "signup.accounts", references = ["id"] }]

[[changes]]
action = "create_table"
[changes.table]
name = "signup.policy"
columns = [{ name = "id", kind = "integer" }, { name = "enabled", kind = "integer" }]
primary = ["id"]
