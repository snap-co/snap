[package]
name = "testy-native"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "testy-client-native"
path = "src/main.rs"

[dependencies]
testy = { path = ".." }
snap-transport = { path = "../../../crates/transport" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }

[lints]
workspace = true

[package.metadata.snap]
role = "host"
