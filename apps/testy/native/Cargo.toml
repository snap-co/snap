[package]
name = "testy-native"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "testy-client-native"
path = "src/main.rs"

[dependencies]
testy = { path = ".." }
snap-runtime-local = { path = "../../../crates/platform/runtime-local", features = ["native"] }
tokio = { version = "1", features = ["rt", "net"] }

[lints]
workspace = true

[package.metadata.snap]
role = "composition"
