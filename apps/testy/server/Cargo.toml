[package]
name = "testy-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
snap-config = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
testy = { path = ".." }
snap-transport = { path = "../../../crates/transport" }
snap-runtime-local = { path = "../../../crates/platform/runtime-local" }
futures = { version = "0.3", features = ["executor"], optional = true }
tokio = { version = "1", features = ["rt", "net", "sync", "macros"], optional = true }
snap-store = { workspace = true, optional = true }
snap-store-sqlite = { path = "../../../crates/platform/store-sqlite", optional = true }
toml = { version = "0.9", optional = true }
snap-identity = { path = "../../../crates/identity", optional = true }
snap-crypto = { path = "../../../crates/platform/crypto", optional = true }

[features]
default = ["memory"]
memory = ["dep:futures"]
native = ["snap-runtime-local/native", "dep:tokio", "identity", "dep:snap-config", "dep:serde"]
web = ["snap-runtime-local/web", "dep:tokio", "identity", "dep:snap-config", "dep:serde"]
store = ["testy/store", "dep:snap-store", "dep:snap-store-sqlite", "dep:toml"]
identity = ["store", "dep:snap-identity", "dep:snap-crypto"]

[[test]]
name = "store"
path = "../tests/store.rs"
required-features = ["store"]

[[bin]]
name = "testy-web"
path = "src/web.rs"
required-features = ["web"]

[[bin]]
name = "testy-memory-demo"
path = "src/memory.rs"
required-features = ["memory"]

[[bin]]
name = "testy-server-native"
path = "src/native.rs"
required-features = ["native"]


[lints]
workspace = true

[dev-dependencies]
tempfile = "3"

[[test]]
name = "startup"
path = "../tests/startup.rs"
required-features = ["native"]

[[test]]
name = "memory"
path = "../tests/memory.rs"
required-features = ["memory"]

[[test]]
name = "native"
path = "../tests/native.rs"
required-features = ["native"]

[package.metadata.snap]
role = "composition"

[[test]]
name = "development"
path = "../tests/development.rs"
required-features = ["web"]

[[test]]
name = "identity"
path = "../tests/identity.rs"
required-features = ["identity", "memory"]
