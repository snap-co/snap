[package]
name = "testy-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
snap-config = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
testy = { path = ".." }
snap-transport = { path = "../../../crates/transport" }
testy-native = { path = "../native", optional = true }
snap-transport-ws = { path = "../../../crates/platform/transport-ws", optional = true }
serde_json = { workspace = true, optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
futures-util = { version = "0.3", optional = true }
futures = { version = "0.3", features = ["executor"], optional = true }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"], optional = true }
snap-store = { workspace = true, optional = true }
snap-store-sqlite = { path = "../../../crates/platform/store-sqlite", optional = true }
toml = { version = "0.9", optional = true }
snap-identity = { path = "../../../crates/identity", optional = true }
snap-crypto = { path = "../../../crates/platform/crypto", optional = true }

[features]
default = ["memory"]
memory = ["dep:futures"]
native = ["dep:testy-native", "dep:tokio", "identity", "dep:snap-config", "dep:serde"]
web = ["dep:tokio", "dep:serde_json", "dep:axum", "dep:tower-http", "dep:futures-util", "dep:snap-transport-ws", "identity", "dep:snap-config", "dep:serde"]
store = ["testy/store", "dep:snap-store", "dep:snap-store-sqlite", "dep:toml"]
identity = ["store", "dep:snap-identity", "dep:snap-crypto"]

[[test]]
name = "store"
path = "../tests/store.rs"
required-features = ["store"]

[[bin]]
name = "testy-web"
path = "src/bin/web.rs"
required-features = ["web"]

[[bin]]
name = "testy-memory-demo"
path = "src/bin/memory.rs"
required-features = ["memory"]

[[bin]]
name = "testy-server-native"
path = "src/native.rs"
required-features = ["native"]


[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.29"

[[test]]
name = "startup"
path = "../tests/startup.rs"
required-features = ["native"]

[[test]]
name = "memory"
path = "../tests/memory.rs"
required-features = ["memory"]

[[test]]
name = "native"
path = "../tests/native.rs"
required-features = ["native"]

[package.metadata.snap]
role = "composition"

[[test]]
name = "development"
path = "../tests/development.rs"
required-features = ["web"]

[[test]]
name = "identity"
path = "../tests/identity.rs"
required-features = ["identity", "memory"]
