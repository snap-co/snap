version = 1
application = "testy"

[build]
server = "local"
binary = "testy-web"
features = ["web"]

[check]
rust = ["Cargo.toml", "local/Cargo.toml", "wasm/Cargo.toml"]
typescript = ["web/tsconfig.json"]

[[check.variants]]
manifest = "local/Cargo.toml"
features = ["memory"]
default_features = false
allowed_local_dependencies = ["testy", "snap-transport", "snap-runtime-local", "snap-store"]

[[check.variants]]
manifest = "local/Cargo.toml"
features = ["native"]
default_features = false
allowed_local_dependencies = ["testy", "snap-transport", "snap-runtime-local", "snap-config", "snap-store", "snap-store-sqlite", "snap-identity", "snap-crypto"]

[[check.variants]]
manifest = "local/Cargo.toml"
features = ["web"]
default_features = false
allowed_local_dependencies = ["testy", "snap-transport", "snap-runtime-local", "snap-transport-ws", "snap-config", "snap-store", "snap-store-sqlite", "snap-identity", "snap-crypto"]

[[check.variants]]
manifest = "local/Cargo.toml"
features = ["store"]
default_features = false
allowed_local_dependencies = ["testy", "snap-transport", "snap-runtime-local", "snap-store", "snap-store-sqlite"]

[[check.variants]]
manifest = "local/Cargo.toml"
features = ["identity"]

[test.memory]
commands = [
  ["cargo", "test", "-p", "snap-transport", "--", "--include-ignored"],
  ["cargo", "test", "-p", "testy-local", "--features", "web", "--test", "memory", "--test", "development", "--test", "store", "--test", "identity", "--", "--include-ignored"],
  ["cargo", "test", "-p", "snap-runtime-local", "--features", "web", "--lib", "--", "--include-ignored"],
]

[test.native]
commands = [
  ["cargo", "test", "-p", "testy-local", "--features", "native", "--test", "native", "--test", "startup", "--", "--include-ignored"],
  ["cargo", "test", "-p", "snap-crypto", "--test", "native", "--", "--ignored"],
]

[test.browser]
commands = [["../../bin/browser-tests", "testy"]]
