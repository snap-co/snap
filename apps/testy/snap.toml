version = 1
application = "testy"

[build.clients.web]
kind = "web"
source = "web"
wasm = "web/wasm/Cargo.toml"

[build.clients.native]
kind = "native"
manifest = "native/Cargo.toml"
binary = "testy-client-native"
targets = ["host"]

[build.servers.native]
manifest = "server/Cargo.toml"
targets = ["host"]
binary = "testy-web"
features = ["web"]
default_features = false

[check]
rust = ["Cargo.toml", "server/Cargo.toml", "web/wasm/Cargo.toml", "native/Cargo.toml"]
typescript = ["web/tsconfig.json"]

[[check.variants]]
manifest = "server/Cargo.toml"
features = ["memory"]
default_features = false
allowed_local_dependencies = ["testy", "snap-transport", "snap-store", "snap-identity"]

[[check.variants]]
manifest = "server/Cargo.toml"
features = ["native"]
default_features = false
allowed_local_dependencies = ["testy", "testy-native", "snap-transport", "snap-config", "snap-store", "snap-store-sqlite", "snap-identity", "snap-crypto"]

[[check.variants]]
manifest = "server/Cargo.toml"
features = ["web"]
default_features = false
allowed_local_dependencies = ["testy", "snap-transport", "snap-transport-ws", "snap-config", "snap-store", "snap-store-sqlite", "snap-identity", "snap-crypto"]

[[check.variants]]
manifest = "server/Cargo.toml"
features = ["store"]
default_features = false
allowed_local_dependencies = ["testy", "snap-transport", "snap-store", "snap-store-sqlite", "snap-identity"]

[[check.variants]]
manifest = "server/Cargo.toml"
features = ["identity"]

[test.memory]
commands = [
  ["cargo", "test", "-p", "snap-transport", "--", "--include-ignored"],
  ["cargo", "test", "-p", "testy-server", "--features", "web", "--test", "memory", "--test", "development", "--test", "store", "--test", "identity", "--", "--include-ignored"],
  ["cargo", "test", "-p", "testy-server", "--features", "web", "--lib", "--", "--include-ignored"],
]

[test.native]
commands = [
  ["cargo", "test", "-p", "testy-server", "--features", "native", "--test", "native", "--test", "startup", "--", "--include-ignored"],
  ["cargo", "test", "-p", "snap-crypto", "--test", "native", "--", "--ignored"],
]

[test.browser]
commands = [["../../bin/browser-tests", "testy"]]
