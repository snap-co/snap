[package]
name = "authy-native"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "authy"
path = "src/main.rs"
doc = false

[dependencies]
authy.workspace = true
snap-native.workspace = true
snap-protocol.workspace = true
snap-runtime.workspace = true
snap-store.workspace = true
snap-oidc.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync"] }

[lints]
workspace = true

[package.metadata.snap]
role = "composition"
