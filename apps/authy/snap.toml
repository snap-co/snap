version = 1
application = "authy"

[build]

[check]
rust = ["Cargo.toml", "native/Cargo.toml"]

[test.memory]
commands = [["cargo", "test", "-p", "authy", "-p", "snap-oidc"]]

[test.browser]
commands = [["../../bin/check-authy-web"]]

[test.native]
commands = [["cargo", "build", "-p", "authy-native"], ["bun", "test", "tests/integration"]]
