version = 1
application = "authy"

[build.clients.web]
kind = "web"
source = "web"
wasm = "web/wasm/Cargo.toml"
sdk = "web/client.ts"

[build.servers.native]
manifest = "server/Cargo.toml"
targets = ["host"]

[check]
rust = ["Cargo.toml", "server/Cargo.toml", "web/wasm/Cargo.toml"]
typescript = ["web/tsconfig.json"]

[test.memory]
commands = [["cargo", "test", "-p", "authy", "-p", "snap-oidc"]]

[test.browser]
commands = [["../../bin/browser-tests", "authy"]]

[test.native]
commands = [["../../bin/snap", "build", "--project", ".", "--web-only", "--output", "dist/development/clients/web"], ["cargo", "test", "-p", "authy-server", "--test", "http", "--", "--ignored"]]
