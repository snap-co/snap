[package]
name = "healthy-wasm"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
healthy.workspace = true
snap-client-wasm.workspace = true
snap-browser.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[lints]
workspace = true

[package.metadata.snap]
role = "composition"

[package.metadata.cargo-machete]
# wasm_bindgen expands async exports into calls to this crate.
ignored = ["wasm-bindgen-futures"]
