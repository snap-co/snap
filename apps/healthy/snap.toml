version = 1
application = "healthy"

[server]
manifest = "native/Cargo.toml"
bin = "healthy"

[web]
package-dir = "../.."
application = "web/app.tsx"
host = "../../clients/react/main.tsx"
html = "../../clients/react/index.html"
wasm-manifest = "wasm/Cargo.toml"
bindings = ".snap/bindings"

[dev]
address = "127.0.0.1:3846"

[check]
architecture = true
rust = ["Cargo.toml", "native/Cargo.toml", "wasm/Cargo.toml"]
build = true
commands = [
    ["bun", "../../scripts/check-client.ts"],
    ["bun", "test", "../../tests/sdk/browser-runtime.test.ts"],
    ["bunx", "playwright", "test", "--config", "../../playwright.config.ts", "healthy.spec.ts"],
]
