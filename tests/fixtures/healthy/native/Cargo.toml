[package]
name = "healthy-native"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
healthy.workspace = true
snap-native.workspace = true

[dev-dependencies]
snap-protocol.workspace = true
serde_json.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }

[[bin]]
name = "healthy"
path = "src/main.rs"
# The CLI is documented in README; its target name would overwrite Healthy library docs.
doc = false

[[test]]
name = "client-contract"
path = "../../../sdk/native.rs"

[lints]
workspace = true

[package.metadata.snap]
role = "composition"
