[package]
name = "snap-platform-tests"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
snap-store.workspace = true
snap-transport = { path = "../../crates/transport" }
serde_json.workspace = true

[dev-dependencies]
snap-store-sqlite = { path = "../../crates/platform/store-sqlite" }
snap-transport-tcp = { path = "../../crates/platform/transport-tcp" }
snap-transport-ws = { path = "../../crates/platform/transport-ws" }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt", "net", "sync", "time", "io-util"] }
tokio-tungstenite = "0.29"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3"

[lints]
workspace = true

[package.metadata.snap]
role = "tool"
