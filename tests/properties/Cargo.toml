[package]
name = "snap-core-properties"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

# A separate host test consumer keeps Hegel's compilation and exploration out of
# the default check. The cases themselves stay with the capability that owns them.
[dev-dependencies]
hegeltest = { version = "=0.47.4", features = ["static-engine"] }
snap-transport = { path = "../../crates/transport" }
snap-execution = { path = "../../crates/execution" }
snap-platform-local = { path = "../../platforms/local" }
snap-store = { path = "../../crates/store" }
snap-sqlite = { path = "../../platforms/sqlite" }
snap-identity = { path = "../../crates/identity" }
snap-access = { path = "../../crates/access" }
snap-document = { path = "../../crates/document" }
snap-document-local = { path = "../../platforms/document" }
serde_json.workspace = true
toml = "0.9"

[[test]]
name = "transport-lifecycle"
path = "../../crates/transport/tests/properties/lifecycle.rs"

[[test]]
name = "transport-client"
path = "../../crates/transport/tests/properties/client.rs"

[[test]]
name = "execution-properties"
path = "../../crates/execution/tests/properties/execution.rs"

[[test]]
name = "platform-properties"
path = "../../platforms/local/tests/properties/lifecycle.rs"

[lints]
workspace = true

[[test]]
name = "store-properties"
path = "../../crates/store/tests/properties/resident.rs"

[package.metadata.snap]
role = "tool"

[[test]]
name = "identity-properties"
path = "../../crates/identity/tests/properties/identity.rs"

[[test]]
name = "document-host-properties"
path = "../../platforms/document/tests/properties/lifecycle.rs"
