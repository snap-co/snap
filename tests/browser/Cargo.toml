[package]
name = "snap-browser-tests"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false
default-run = "snap-browser-tests"

[dependencies]
anyhow = "1"
chromiumoxide = { version = "=0.9.1", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "time", "io-util", "io-std", "sync"] }
toml = "0.9"
nix = { version = "0.30", features = ["signal", "process", "net"] }
axum = { version = "0.8", features = ["ws"] }

[package.metadata.snap]
role = "tool"

[lints]
workspace = true
