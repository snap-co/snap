[tools]
rust = "1.98.1"

[env]
_.path = ["{{ config_root }}/target/debug"]

[tasks.cli]
description = "Build this checkout's snap executable"
run = "cargo build --target-dir target -p snap-cli"

[tasks.dev]
description = "Build Healthy, replace the selected port's listener, and run"
run = "exec ./bin/dev"
