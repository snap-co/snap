[tools]
rust = "1.98.1"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-deny" = "0.20.2"

[env]
_.path = ["{{ config_root }}/../bin", "{{ config_root }}/target/debug"]

[tasks.cli]
description = "Build this checkout's snap executable"
run = "cargo build --target-dir target -p snap-cli"

[tasks.dev]
description = "Build Testy's browser SDK and start its local development host"
run = "exec ./bin/dev"

[tasks.factorio]
description = "Build and watch Factorio using this checkout's development profile"
run = "exec ./bin/snap dev apps/factorio"

[tasks.factorio-build]
description = "Rebuild this checkout's native Factorio command without installing it"
run = "cargo build --locked --target-dir target -p factorio-native"
