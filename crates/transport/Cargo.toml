[package]
name = "snap-transport"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
native-client = ["dep:tokio", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:webpki-roots"]
native-server = ["native-client", "dep:axum", "dep:futures-util", "dep:percent-encoding", "dep:base64", "dep:hmac", "dep:sha2", "dep:rand"]

[dependencies]
snap-store.workspace = true
serde.workspace = true
serde_json.workspace = true
ciborium = { version = "0.2.2", default-features = false }
spin = { version = "0.10", default-features = false, features = ["mutex", "spin_mutex"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"], optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
futures-util = { version = "0.3", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }
webpki-roots = { version = "1", optional = true }
percent-encoding = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }

[dev-dependencies]
snap-store-sqlite = { path = "../platform/store-sqlite" }
toml = "0.9"
snap-document.workspace = true
snap-access.workspace = true
tokio = { version = "1", features = ["test-util"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "native_http"
required-features = ["native-server"]

[[test]]
name = "native_dispatch"
required-features = ["native-server"]

[[test]]
name = "native_binary"
required-features = ["native-server"]

[[test]]
name = "native_tls"
required-features = ["native-server"]

[lints]
workspace = true

[package.metadata.snap]
role = "interface"
