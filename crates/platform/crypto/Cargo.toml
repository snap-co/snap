[package]
name = "snap-crypto"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
snap-identity = { path = "../../identity" }
snap-store.workspace = true
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
getrandom = "0.3"
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
serde_json.workspace = true

[dev-dependencies]
snap-store.workspace = true
rand = "0.8"

[lints]
workspace = true

[package.metadata.snap]
role = "platform"
