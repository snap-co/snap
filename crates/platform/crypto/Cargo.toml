[package]
name = "snap-crypto"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
passkey = ["dep:webauthn-rs", "dep:serde"]

[dependencies]
snap-identity = { path = "../../identity" }
snap-store.workspace = true
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
getrandom = "0.3"
base64 = "0.22"
rsa = { version = "0.9", default-features = false, features = ["std", "u64_digit", "sha2"] }
serde_json.workspace = true
serde = { workspace = true, optional = true }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation", "conditional-ui", "danger-credential-internals"], optional = true }

[dev-dependencies]
snap-store.workspace = true
rand = "0.8"
snap-store-sqlite = { path = "../store-sqlite" }
toml = "0.9"
tempfile = "3"
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softpasskey"] }

[[test]]
name = "passkey"
required-features = ["passkey"]

[lints]
workspace = true

[package.metadata.snap]
role = "platform"
