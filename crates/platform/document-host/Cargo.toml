[package]
name = "snap-document-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
snap-document.workspace = true
snap-access.workspace = true
snap-store.workspace = true
snap-transport = { path = "../../transport" }
snap-transport-tcp = { path = "../transport-tcp" }
serde_json.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
snap-store-sqlite = { path = "../store-sqlite" }
toml = "0.9"
tokio-tungstenite = "0.29"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true

[package.metadata.snap]
role = "platform"
