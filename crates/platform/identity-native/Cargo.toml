[package]
name = "snap-identity-native"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
oauth = ["dep:snap-config", "dep:snap-store-sqlite", "dep:snap-transport", "dep:snap-crypto", "dep:axum", "dep:tokio", "dep:reqwest", "dep:sha2", "dep:hmac", "dep:rand"]
passkey = ["dep:webauthn-rs"]

[dependencies]
snap-config = { workspace = true, optional = true }
serde.workspace = true
snap-store.workspace = true
snap-store-sqlite = { path = "../store-sqlite", optional = true }
snap-transport = { path = "../../transport", optional = true, features = ["native-server"] }
snap-identity = { path = "../../identity" }
snap-crypto = { path = "../crypto", optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["sync"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"], optional = true }
serde_json.workspace = true
url = "2"
base64 = "0.22"
sha2 = { version = "0.10", features = ["oid"], optional = true }
hmac = { version = "0.12", optional = true }
rand = { version = "0.8", optional = true }
# Internal credential access is used only to compare a verified assertion's
# counter with the latest committed key, not the challenge's stale snapshot.
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation", "conditional-ui", "danger-credential-internals"], optional = true }

[dev-dependencies]
snap-crypto = { path = "../crypto" }
snap-store-sqlite = { path = "../store-sqlite" }
toml = "0.9"
tempfile = "3"
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softpasskey"] }

[[test]]
name = "passkey"
required-features = ["passkey"]
[lints]
workspace = true

[package.metadata.snap]
role = "platform"
