[package]
name = "snap-transport-tcp"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
snap-transport = { path = "../../transport", features = ["native-legacy"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3"

[lints]
workspace = true

[package.metadata.snap]
role = "platform"
