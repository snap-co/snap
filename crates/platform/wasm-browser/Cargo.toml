[package]
name = "snap-wasm-browser"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
snap-transport = { path = "../../transport" }
serde_json.workspace = true
js-sys = "=0.3.105"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures = "=0.4.78"
web-sys = { version = "=0.3.105", features = ["Window", "Headers", "Request", "RequestInit", "RequestCredentials", "RequestRedirect", "Response"] }

[lints]
workspace = true

[package.metadata.snap]
role = "platform"
