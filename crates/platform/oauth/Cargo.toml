[package]
name = "snap-oauth-local"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
snap-config.workspace = true
serde.workspace = true
snap-oidc.workspace = true
snap-store.workspace = true
snap-store-sqlite = { path = "../store-sqlite" }
snap-document-host = { path = "../document-host" }
axum = "0.8"
tokio = { version = "1", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde_json.workspace = true
url = "2"
base64 = "0.22"
sha2 = { version = "0.10", features = ["oid"] }
hmac = "0.12"
rand = "0.8"
rsa = "0.9"

[lints]
workspace = true

[package.metadata.snap]
role = "platform"
