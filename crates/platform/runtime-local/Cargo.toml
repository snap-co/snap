[package]
name = "snap-runtime-local"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
native = ["dep:tokio", "dep:serde_json"]
web = ["dep:tokio", "dep:serde_json", "dep:serde", "dep:axum", "dep:tower-http", "dep:futures-util", "dep:snap-transport-ws"]

[dependencies]
snap-transport = { path = "../../transport" }
snap-transport-ws = { path = "../transport-ws", optional = true }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"], optional = true }
serde_json = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tokio-tungstenite = "0.29"

[lints]
workspace = true

[package.metadata.snap]
role = "platform"
