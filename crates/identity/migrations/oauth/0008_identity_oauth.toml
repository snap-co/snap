# Add Identity to hosts whose existing migration history contains only OAuth.
# This is an alternative to the historical password migration chain, not an
# additional chain. Both install the same Identity schema.
id = "0008_identity_oauth"

[[changes]]
action = "create_table"
[changes.table]
name = "identity.identities"
primary = ["id"]
columns = [{ name = "id", kind = "text" }]

[[changes]]
action = "create_table"
[changes.table]
name = "identity.credentials"
primary = ["locator"]
columns = [{ name = "locator", kind = "text" }, { name = "identity", kind = "text" }, { name = "material", kind = "text" }, { name = "kind", kind = "text" }, { name = "label", kind = "text" }]
foreign = [{ columns = ["identity"], table = "identity.identities", references = ["id"] }]

[[changes]]
action = "create_table"
[changes.table]
name = "identity.sessions"
primary = ["digest"]
columns = [{ name = "digest", kind = "bytes" }, { name = "identity", kind = "text" }, { name = "expires", kind = "integer" }, { name = "issued", kind = "integer" }]
foreign = [{ columns = ["identity"], table = "identity.identities", references = ["id"] }]

[[changes]]
action = "create_table"
[changes.table]
name = "identity.attempts"
primary = ["id"]
columns = [{ name = "id", kind = "text" }, { name = "data", kind = "text" }]

[[changes]]
action = "create_table"
[changes.table]
name = "identity.legacy_owners"
primary = ["identity"]
columns = [{ name = "identity", kind = "text" }]
